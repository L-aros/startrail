name: infrastructure
publish_to: none
description: 拾星迹本地持久化与密码学适配层。
version: 1.0.0
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.11.4

# Add regular dependencies here.
dependencies:
  crypto: 3.0.7
  domain:
    path: ../domain
  ffi: 2.2.0
  sodium:
    path: ../../third_party/sodium
  sqlite3:
    path: ../../third_party/sqlite3
  # path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.32.0

hooks:
  user_defines:
    sqlite3:
      source: source
      path: ../../third_party/sqlcipher/sqlcipher_amalgamation.c
      startrail_bundled_openssl_root: ../../third_party/sqlcipher/openssl
      additional_includes:
        - ../../third_party/sqlcipher
      additional_libraries:
        - crypto
      defines:
        defines:
          - SQLITE_HAS_CODEC
          - SQLITE_TEMP_STORE=2
          - SQLITE_EXTRA_INIT=sqlcipher_extra_init
          - SQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown
          - HAVE_USLEEP
          - SQLITE_USE_URI
          - SQLITE_ENABLE_MEMORY_MANAGEMENT
